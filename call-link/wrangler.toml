# Calls through a link (see README.md).
# Secrets: wrangler secret put SFU_APP_ID / SFU_APP_SECRET, and optionally TURN_KEY_ID / TURN_KEY_TOKEN
name = "howyoudoin-call-link"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

# The address in every invite link: changing it breaks links already sent. Cloudflare makes the DNS record and
# certificate (howyoudoin.app is a zone on the same account)
routes = [{ pattern = "call.howyoudoin.app", custom_domain = true }]
# Only that address: no *.workers.dev or preview addresses
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# /call/<room> is the call page; the API is answered by the worker
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# One Durable Object per call: who's in it, and the signalling between the two pages and Realtime SFU
[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallRoom"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "CallAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallAccount"]

[vars]
PLAY_PACKAGE = "com.devvalor.howyoudoing"

# At most this many calls created per IP address a minute, so nobody can run up the bill
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
