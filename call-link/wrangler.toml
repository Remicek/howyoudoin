# Calls through a link (see README.md). Secrets: wrangler secret put LIVEKIT_API_KEY / LIVEKIT_API_SECRET
name = "howyoudoin-call-link"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# /call/<room> is the call page; the API is answered by the worker
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# The LiveKit project's WebSocket URL, e.g. wss://howyoudoin-xxxx.livekit.cloud
LIVEKIT_URL = ""

# At most this many calls created per IP address a minute, so nobody can run up the LiveKit bill
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
