# Additions to detekt's default rules (buildUponDefaultConfig), tuned for Compose and this codebase.
naming:
  FunctionNaming:
    # Composables are named like types
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    # Icons and colors are PascalCase, like Compose's own
    constantPattern: "[A-Z][A-Za-z0-9_]*"
  MatchingDeclarationName:
    active: false

complexity:
  LongParameterList:
    # Composables take their state and callbacks as parameters
    ignoreAnnotated: ["Composable"]
  LongMethod:
    ignoreAnnotated: ["Composable"]
  CyclomaticComplexMethod:
    # A when over the kinds of an event or error is one decision, not one per branch
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # Implementations of an interface count against the interface, not again in each class
    ignoreOverridden: true
    ignorePrivate: true
    # Repositories, the native messenger and the sync engines offer one function per chat operation
    thresholdInInterfaces: 25
    thresholdInClasses: 20

style:
  ReturnCount:
    # Early returns at the top of a function (if (x == null) return) keep the rest flat
    excludeGuardClauses: true
  MagicNumber:
    # Sizes, colors and durations in UI code read better inline
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ["Composable", "Preview"]
    excludes: ["**/test/**", "**/commonTest/**", "**/androidInstrumentedTest/**", "**/designsystem/**"]
  UnusedPrivateMember:
    # Previews are used by the IDE
    ignoreAnnotated: ["Preview"]
