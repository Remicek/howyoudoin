# Builds the Android app and runs the unit tests on every push and pull request. The debug APK is attached to each
# run under Artifacts.
#
# The network clients library (composeApp/libs/hydbridge.aar) isn't in git: it's built from the mautrix bridges with
# Go, Rust and the NDK, which takes a while, so it's cached and only rebuilt when something in bridge-mobile/ changes.
#
# Optional repository secrets: TELEGRAM_API_ID and TELEGRAM_API_HASH (from my.telegram.org). Without them the app
# builds without Telegram.
name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 29.0.14206865
      GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@v4

      - name: Restore the network clients library
        id: bridge-cache
        uses: actions/cache@v4
        with:
          path: composeApp/libs/hydbridge.aar
          key: hydbridge-android-${{ hashFiles('bridge-mobile/**') }}

      - name: Set up the NDK
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.x"
          cache-dependency-path: bridge-mobile/go.sum

      - name: Set up gomobile, Rust and protoc
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          # libsignal's rust-toolchain file pins Rust
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          sudo apt-get install -y --no-install-recommends protobuf-compiler > /dev/null

      - name: Build the network clients library
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          bridge-mobile/scripts/fetch-bridges.sh
          bridge-mobile/scripts/build-android.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        if: env.TELEGRAM_API_ID != ''
        run: printf 'telegram.apiId=%s\ntelegram.apiHash=%s\n' "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the app
        run: ./gradlew :composeApp:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: howyoudoin-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
