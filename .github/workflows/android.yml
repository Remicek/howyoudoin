# On every push and pull request: unit tests, the debug APK (attached to the run under Artifacts), and the end-to-end
# UI tests on an Android emulator.
#
# Optional repository secrets: TELEGRAM_API_ID and TELEGRAM_API_HASH (from my.telegram.org). Without them the app
# builds without Telegram.
name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  build:
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hydbridge
          path: composeApp/libs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        if: env.TELEGRAM_API_ID != ''
        run: printf 'telegram.apiId=%s\ntelegram.apiHash=%s\n' "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the app
        run: ./gradlew :composeApp:assembleDebug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: howyoudoin-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  ui-tests:
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hydbridge
          path: composeApp/libs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # Built before the emulator starts, so it doesn't sit idle while Gradle compiles
      # The emulator and Gradle's daemons together run the runner out of memory, so the daemons from this build
      # are stopped and the test run below gets a small heap (it only installs and runs what's built here)
      - name: Build the app and the tests
        run: |
          ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      # The emulator's data partition needs more room than the runner leaves; these tools aren't used here
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 or newer: the tests pick the app's language per app (Android 13+)
      - name: End-to-end tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :composeApp:connectedDebugAndroidTest -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.daemon.jvmargs=-Xmx1g

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-reports
          path: |
            composeApp/build/reports/androidTests/
            composeApp/build/outputs/androidTest-results/
          if-no-files-found: ignore
