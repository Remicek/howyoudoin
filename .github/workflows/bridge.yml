# Builds the network clients library (composeApp/libs/hydbridge.aar), which isn't in git, and hands it to the calling
# workflow as the "hydbridge" artifact. It's built from the mautrix bridges with Go, Rust and the NDK, which takes a
# while, so it's cached and only rebuilt when something in bridge-mobile/ changes. It includes x86_64 for the emulator
# the UI tests run on; release builds keep only arm64.
name: Network clients library

on:
  workflow_call:

jobs:
  hydbridge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HYDBRIDGE_ARCHS: arm64 amd64
      NDK_VERSION: 29.0.14206865
      GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@v4

      - name: Restore from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            composeApp/libs/hydbridge.aar
            composeApp/libs/hydbridge-sources.jar
          key: hydbridge-android-arm64-amd64-${{ hashFiles('bridge-mobile/**') }}

      - name: Set up the NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.x"
          cache-dependency-path: bridge-mobile/go.sum

      - name: Set up gomobile, Rust and protoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          # libsignal's rust-toolchain file pins Rust
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          sudo apt-get install -y --no-install-recommends protobuf-compiler > /dev/null

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bridge-mobile/scripts/fetch-bridges.sh
          bridge-mobile/scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hydbridge
          path: |
            composeApp/libs/hydbridge.aar
            composeApp/libs/hydbridge-sources.jar
          retention-days: 3
