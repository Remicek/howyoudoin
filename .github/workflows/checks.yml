# Security and code-quality checks. They run before every release (release.yml waits for them) and can be started
# by hand: Actions → Checks → Run workflow.
#
# - Secrets: gitleaks scans the whole git history for keys, tokens and passwords
# - Go vulnerabilities: govulncheck reports known vulnerabilities the network clients actually call
# - Gradle wrapper: the gradle-wrapper.jar is an official Gradle release
# - Android lint (correctness, security and translation checks) and detekt (Kotlin static analysis); findings that
#   predate detekt are in config/detekt/baseline.xml, new ones fail
name: Checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  go-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: bridge-mobile/go.sum
      - name: govulncheck
        run: |
          bridge-mobile/scripts/fetch-bridges.sh
          cd bridge-mobile
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  gradle-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  lint:
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hydbridge
          path: composeApp/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt

      - name: Android lint
        if: success() || failure()
        run: ./gradlew lintDebug --continue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
