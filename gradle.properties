#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9: the KMP modules still use com.android.library / com.android.application with androidTarget(), which the
# new DSL doesn't allow. Keep the old DSL until they move to com.android.kotlin.multiplatform.library (and the app
# to its own module): https://kotl.in/gradle/agp-new-kmp. Supported through AGP 9.x, removed in AGP 10.
android.newDsl=false
# ...and AGP 9's built-in Kotlin, which clashes with the Kotlin Multiplatform plugin on those modules
android.builtInKotlin=false
